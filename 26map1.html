<!DOCTYPE html>
<html>
<head>
  <title>Testing testing</title>
  
  <script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css" rel="stylesheet" />
  
  <script src="https://app.unpkg.com/@watergis/maplibre-gl-export@4.1.0/files/dist/maplibre-gl-export.umd.js"></script>
	<link href="https://app.unpkg.com/@watergis/maplibre-gl-export@4.1.0/files/dist/maplibre-gl-export.css" rel="stylesheet" />
	
  <style>
    body { margin: 0; padding: 0; }
  	#map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
  
<body>
  <div id="map"></div>  

  <script>
    var map = new maplibregl.Map({
        container: 'map', // container id
        style: 'https://demotiles.maplibre.org/globe.json', // style URL
        center: [0, 0], // starting position [lng, lat]
        zoom: 2 // starting zoom
    });

    	var exportControl = new MaplibreExportControl({
		PageSize: Size.A3,
		PageOrientation: PageOrientation.Portrait,
		Format: Format.PNG,
		DPI: DPI[96],
		Crosshair: true,
		PrintableArea: true,
		Local: 'en',
		
	});
    
	map.addControl(exportControl, 'top-right');
    
  </script>
  
</body>
  
</html>
