<!DOCTYPE html>
<html>
<head>
  <title>Testing testing</title>
  
  <script src="https://unpkg.com/maplibre-gl@4.1.0/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.1.0/dist/maplibre-gl.css" rel="stylesheet" />
  
	<script src="https://github.com/watergis/maplibre-gl-export/releases/download/v1.3.6/maplibre-gl-export.js"></script>
	<link href="https://github.com/watergis/maplibre-gl-export/releases/download/v1.3.6/maplibre-gl-export.css" rel="stylesheet" />
	
  <style>
    body { margin: 0; padding: 0; }
  	#map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
  
<body>
  <div id="map"></div>  

  <script>
	var map = new maplibregl.Map({
		container: 'map', // container id
		style: 'https://api.maptiler.com/maps/4b662653-45ea-424c-9ab5-abea520ca5bc/style.json?key=82w8f522FRrsV0W7g8QF', // style URL
		center: [103.8198, 1.3521], // starting position [lng, lat]
		zoom: 4 // starting zoom
		});

	var exportControl = new MaplibreExportControl({
		PageSize: Size.A3,
		PageOrientation: PageOrientation.Portrait,
		Format: Format.PNG,
		DPI: DPI[96],
		Crosshair: true,
		PrintableArea: true,
		Local: 'en',
		
	});
    
	map.addControl(exportControl, 'top-right');
    
  </script>
  
</body>
  
</html>
